// expo-module-gradle-plugin replaces the older ExpoModulesCorePlugin.gradle helper
// and supplies the core dependencies and publishing config this file used to request
// by hand. It is also the only thing that applies the `io.github.lukmccall.pika`
// Kotlin compiler plugin, which SDK 57's expo-modules-core needs: it rewrites the
// type-descriptor intrinsics behind the Function/AsyncFunction DSL. Without it every
// call in definition() keeps an unprocessed placeholder whose fallback body throws
// "This function has a reified type parameter and thus can only be inlined at
// compilation time", killing the host the moment this module registers.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.twowayaudio'
version = '0.1.0'

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 34)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 21)
      targetSdkVersion safeExtGet("targetSdkVersion", 34)
    }
  }
}

android {
  namespace "expo.modules.twowayaudio"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
